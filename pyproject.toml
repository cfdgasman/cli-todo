[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-todo"
version = "0.1.0"
description = "A tiny command-line to-do list that stores tasks in a JSON file."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
todo = "todo.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["todo"]
